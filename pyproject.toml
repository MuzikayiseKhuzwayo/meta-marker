[project]
name = "meta-marker"
version = "1.0.0"
description = "Deterministic Market Intelligence Engine (MIE) with Dynamic Reliability Scoring and MT5/Synthetic Bridge"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.128.8",
    "metatrader5>=5.0.5735; sys_platform == 'win32'",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.1",
    "uvicorn>=0.39.0",
    "websockets>=15.0.1",
]

[project.scripts]
meta-marker = "src.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
